<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,_rgba(14,165,233,0.15),_transparent_45%),radial-gradient(circle_at_80%_80%,_rgba(59,130,246,0.12),_transparent_40%)]"></div>

    <main class="mx-auto flex min-h-screen w-full max-w-5xl items-center justify-center px-6 py-12">
      <section class="w-full rounded-3xl border border-slate-800/80 bg-slate-900/70 p-8 shadow-2xl shadow-cyan-950/30 backdrop-blur-xl md:p-10">
        <header class="mb-8">
          <p class="mb-3 inline-flex items-center rounded-full border border-cyan-400/30 bg-cyan-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-cyan-300">
            AI Voice Generator
          </p>
          <h1 class="text-3xl font-bold leading-tight text-white md:text-4xl">Turn text into natural sounding speech</h1>
          <p class="mt-3 max-w-2xl text-slate-300">
            Choose a voice, type your script, and generate an audio clip instantly.
          </p>
        </header>

        <div class="grid gap-6 md:grid-cols-2">
          <div class="md:col-span-2">
            <label for="textInput" class="mb-2 block text-sm font-medium text-slate-200">Text Input</label>
            <textarea
              id="textInput"
              class="h-40 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-slate-100 outline-none ring-cyan-400 transition placeholder:text-slate-500 focus:ring-2"
              placeholder="Type what you want the AI to say..."
            ></textarea>
          </div>

          <div>
            <label for="voiceSelect" class="mb-2 block text-sm font-medium text-slate-200">Voice Selection</label>
            <select
              id="voiceSelect"
              class="w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-slate-100 outline-none ring-cyan-400 transition focus:ring-2"
            >
              <option value="default">Default Voice (LJSpeech)</option>
              <option value="warm">Warm Narrator</option>
              <option value="bright">Bright Assistant</option>
              <option value="calm">Calm Guide</option>
            </select>
          </div>

          <div class="flex items-end">
            <button
              id="generateBtn"
              class="w-full rounded-xl bg-cyan-500 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-300 disabled:cursor-not-allowed disabled:opacity-60"
            >
              Generate Audio
            </button>
          </div>
        </div>

        <p id="statusMessage" class="mt-5 min-h-6 text-sm text-slate-300"></p>

        <div id="audioContainer" class="mt-8 rounded-2xl border border-slate-800 bg-slate-950/50 p-5">
          <div class="mb-3 flex items-center justify-between gap-3">
            <p class="text-sm font-semibold text-cyan-200">Generated Audio</p>
            <button
              id="downloadBtn"
              class="rounded-lg border border-cyan-400/50 px-3 py-2 text-xs font-semibold uppercase tracking-wide text-cyan-200 transition hover:bg-cyan-500/10"
            >
              Download Audio
            </button>
          </div>
          <audio id="audioPlayer" controls class="w-full"></audio>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>

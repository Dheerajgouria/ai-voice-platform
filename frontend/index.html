<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Generator Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,_rgba(6,182,212,0.18),_transparent_45%),radial-gradient(circle_at_80%_80%,_rgba(59,130,246,0.15),_transparent_40%)]"></div>

    <main class="mx-auto max-w-6xl px-6 py-10">
      <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-[0.25em] text-cyan-300">FastAPI + SQLite + Coqui XTTS</p>
          <h1 class="mt-2 text-3xl font-bold">AI Voice Generator Dashboard</h1>
        </div>
        <div id="userBadge" class="hidden rounded-xl border border-cyan-500/40 bg-cyan-500/10 px-4 py-2 text-sm"></div>
      </header>

      <section id="authSection" class="grid gap-6 md:grid-cols-2">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
          <h2 class="mb-4 text-lg font-semibold">Register</h2>
          <div class="space-y-3">
            <input id="registerUsername" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Username" />
            <input id="registerPassword" type="password" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Password" />
            <button id="registerBtn" class="w-full rounded-lg bg-cyan-500 px-4 py-2 font-semibold text-slate-950">Create Account</button>
          </div>
        </div>

        <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
          <h2 class="mb-4 text-lg font-semibold">Login</h2>
          <div class="space-y-3">
            <input id="loginUsername" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Username" />
            <input id="loginPassword" type="password" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Password" />
            <button id="loginBtn" class="w-full rounded-lg bg-blue-500 px-4 py-2 font-semibold text-white">Login</button>
          </div>
        </div>
      </section>

      <section id="appSection" class="hidden space-y-6">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
          <h2 class="mb-4 text-lg font-semibold">Generate Voice</h2>
          <div class="grid gap-4 md:grid-cols-2">
            <div class="md:col-span-2">
              <label class="mb-1 block text-sm text-slate-300">Text</label>
              <textarea id="textInput" class="h-32 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Type text to synthesize..."></textarea>
            </div>
            <div>
              <label class="mb-1 block text-sm text-slate-300">Voice Mode</label>
              <select id="voiceMode" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2">
                <option value="default">Default TTS</option>
                <option value="clone">Clone voice with XTTS</option>
              </select>
            </div>
            <div>
              <label class="mb-1 block text-sm text-slate-300">Speaker sample (.wav) for XTTS</label>
              <input id="speakerAudio" type="file" accept="audio/*" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" />
            </div>
            <div class="md:col-span-2 flex gap-3">
              <button id="generateBtn" class="rounded-lg bg-cyan-500 px-5 py-2 font-semibold text-slate-950">Generate</button>
              <button id="downloadBtn" class="rounded-lg border border-cyan-400 px-5 py-2 font-semibold text-cyan-200">Download</button>
              <button id="logoutBtn" class="ml-auto rounded-lg border border-rose-500 px-5 py-2 font-semibold text-rose-300">Logout</button>
            </div>
          </div>
          <p id="statusMessage" class="mt-3 text-sm text-slate-300"></p>
          <audio id="audioPlayer" controls class="mt-4 w-full"></audio>
        </div>

        <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
          <h2 class="mb-4 text-lg font-semibold">Your Generated Audio History</h2>
          <div id="historyList" class="space-y-3 text-sm text-slate-300"></div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>

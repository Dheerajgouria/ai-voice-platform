<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col justify-center px-6 py-12">
      <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-8 shadow-xl shadow-cyan-950/30">
        <p class="mb-2 text-sm uppercase tracking-[0.2em] text-cyan-400">AI Voice Generator</p>
        <h1 class="mb-4 text-3xl font-bold text-white md:text-4xl">Convert text into realistic speech</h1>
        <p class="mb-8 text-slate-300">
          Enter text below, then click <span class="font-semibold text-cyan-300">Generate Audio</span>.
          The backend uses FastAPI + Coqui TTS to synthesize voice.
        </p>

        <label for="textInput" class="mb-2 block text-sm font-medium text-slate-200">Text to synthesize</label>
        <textarea
          id="textInput"
          class="mb-4 h-36 w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none ring-cyan-400 transition focus:ring-2"
          placeholder="Type your message here..."
        ></textarea>

        <button
          id="generateBtn"
          class="inline-flex items-center rounded-lg bg-cyan-500 px-5 py-3 font-semibold text-slate-950 transition hover:bg-cyan-400 disabled:cursor-not-allowed disabled:opacity-60"
        >
          Generate Audio
        </button>

        <p id="statusMessage" class="mt-4 min-h-6 text-sm text-slate-300"></p>

        <div id="audioContainer" class="mt-6 hidden">
          <p class="mb-2 text-sm font-medium text-cyan-200">Generated Output</p>
          <audio id="audioPlayer" controls class="w-full"></audio>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
